# fly.toml app configuration file generated for webdev-backend on 2026-10-08T21:27:23+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'webdev-backend'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  MONGO_DB_NAME = 'webdev'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
